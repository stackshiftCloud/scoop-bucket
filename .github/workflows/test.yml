name: Test manifest

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify downloads and executable
        shell: pwsh
        run: |
          $manifest = Get-Content bucket/stackshift.json -Raw |
            ConvertFrom-Json
          foreach ($architecture in @("64bit", "arm64")) {
            $entry = $manifest.architecture.$architecture
            $archive = Join-Path $env:RUNNER_TEMP "$architecture.zip"
            Invoke-WebRequest $entry.url -OutFile $archive
            $actual = (Get-FileHash $archive -Algorithm SHA256).Hash
            if ($actual -ne $entry.hash) {
              throw "Hash mismatch for $architecture"
            }
          }
          $directory = Join-Path $env:RUNNER_TEMP "stackshift"
          Expand-Archive (Join-Path $env:RUNNER_TEMP "64bit.zip") $directory
          $output = & (Join-Path $directory "stackshift.exe") version
          if ($output -notmatch "1.0.2") {
            throw "Installed binary did not report v1.0.2"
          }
